# The pipeline, in order.
pipeline = [
  ["LiDAR", "Scans the room 360°, about 7 times a second."],
  ["Laser odometry", "Compares each scan with the last one to see how far the rover moved. No wheel encoders needed."],
  ["SLAM", "Builds the map in 5 cm squares and corrects the rover's position on it."],
  ["Nav2", "Plans a safe path to the clicked goal and follows it."],
  ["Motor node", "Turns speed commands into power for the left and right wheels."],
]

# Sim-to-real lessons: problems the simulation never showed, most important first.
lessons = [
  ["The LiDAR's connection cable was missing", "Built our own cable. The official pin labels did not match the adapter board on 3 pins, so we checked every wire with a multimeter continuity test before soldering."],
  ["Motor noise knocked out the LiDAR's USB in turns", "Soldered noise-filter capacitors on all 4 motors, the motor driver and the 5 V converter, refitted our own cable, and wrote a guard that resets the LiDAR's USB and restarts it on its own."],
  ["Odometry ran backwards", "Our LiDAR faces backwards, and on the Pi the odometry started before it knew that. A scan gate now holds back the scans until the LiDAR's position is known."],
  ["Skid-steer turns stalled halfway", "Measured the power a turn needs (32-35% just to start), then gave each turn a short 42% kick, steady turning power after it, and a fresh kick every 1.5 s."],
  ["The rover drifted off the path on curves", "The two sides differed by only 8% power on Nav2's sharpest curve. Raised the curve gain from 2.0 to 6.0, so they now differ by about 25% and the rover follows the path."],
  ["Hardware PWM failed on the Pi 5", "Found that the Pi 5's PWM overlay needs an explicit clock setting, and mapped our GPIO18 and GPIO19 pins to the right PWM channels."],
  ["RViz showed the scans, but no map and no rover", "Traced it to a network setting that pushed large messages (the map, the rover model) through WSL's network, where they failed. Removing it fixed both."],
  ["Navigation froze when the laptop ran it over WiFi", "Moved SLAM and Nav2 onto the Pi itself, so the rover keeps mapping and driving even when WiFi is weak. The laptop only shows the map."],
  ["WiFi delay of 1.2 s, with 90% of packets lost", "Traced it to the Pi's WiFi chip sleeping between packets (power-save mode). A boot-time job now keeps it awake: delay fell to 11 ms, with no packets lost."],
]

