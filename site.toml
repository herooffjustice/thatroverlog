tagline = "A 4-wheel rover that maps an unknown room with one LiDAR and drives itself to any point on that map."
intro = """
Everything runs on a Raspberry Pi 5 on the rover: the LiDAR driver, laser odometry, \
SLAM Toolbox for mapping and Nav2 for path planning. We first built the same rover in \
simulation, then moved the software to the real robot and fixed the problems the \
simulation never showed. One use we have in mind: mapping a building after a disaster, \
before people go in."""

map_note = """Try it: click anywhere on the map to send the rover a goal. It plans a path, drives there, \
and fills in the map from what its LiDAR sees. This is a small browser version of what our real rover \
does with SLAM Toolbox and Nav2. The room is made up, but the rover's size (30 × 26 cm) is real."""

